<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Feliz Aniversário Ju</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>FELIZ ANIVERSA JU</h1>
    </header>

    <div class="container">

        <!-- Imagem pequena em cima à direita -->
        <img class="img-top-right" src="https://via.placeholder.com/80" alt="Imagem pequena">

        <!-- Imagem pequena em baixo à direita -->
        <img class="img-bottom-right" src="https://via.placeholder.com/80" alt="Imagem pequena">

        <!-- Área central -->
        <div class="middle">
            <div class="text-area">
                <h2>Feliz Aniversário! 🎉</h2>
                <p>
                    Ju, te desejo um dia cheio de alegria, amor e muitas
                    coisas boas. Que seus sonhos se realizem e que esse novo
                    ano da sua vida seja incrível!
                </p>
            </div>

            <div class="image-area">
                <img src="maxi my cutie patootie.jpg" alt="Imagem grande">
            </div>
        </div>

    </div>

</body>
</html>
